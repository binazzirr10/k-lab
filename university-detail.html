    <style>
        .uni-detail-container {
            max-width: 1200px;
            margin: 100px auto 40px;
            padding: 0 20px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            color: #ff9e9e;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .uni-detail-header {
            background: white;
            border-radius: 60px;
            padding: 50px;
            margin-bottom: 40px;
            border: 2px solid #ffb5b5;
            position: relative;
            overflow: hidden;
        }

        .uni-detail-header::before {
            content: "🎓";
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 150px;
            opacity: 0.1;
            transform: rotate(10deg);
        }

        .uni-detail-title {
            font-size: 48px;
            color: #ff9e9e;
            margin-bottom: 10px;
        }

        .uni-detail-kr {
            font-size: 24px;
            color: #b5d1a3;
            margin-bottom: 20px;
        }

        .uni-motto {
            font-style: italic;
            color: #888;
            margin: 20px 0;
            padding: 15px;
            background: #f8f8f8;
            border-radius: 30px;
        }

        .uni-gallery {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        .uni-main-img {
            background: linear-gradient(135deg, #b5d1a3, #ffb5b5);
            border-radius: 40px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            color: white;
            background-size: cover;
            background-position: center;
        }

        .uni-small-imgs {
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: 20px;
        }

        .uni-small-img {
            background: linear-gradient(135deg, #ffb5b5, #b5d1a3);
            border-radius: 30px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            background-size: cover;
            background-position: center;
        }

        .uni-info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-bottom: 40px;
        }

        .info-card {
            background: white;
            border-radius: 40px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(255, 181, 181, 0.1);
        }

        .info-card h3 {
            color: #ff9e9e;
            font-size: 22px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .requirement-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #ffe4e4;
        }

        .requirement-label {
            color: #666;
        }

        .requirement-value {
            font-weight: 600;
            color: #ff9e9e;
        }

        .faculty-list {
            list-style: none;
        }

        .faculty-list li {
            padding: 10px 0;
            border-bottom: 1px solid #ffe4e4;
            color: #666;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .deadline-highlight {
            background: #ffb5b5;
            color: white;
            padding: 15px;
            border-radius: 30px;
            text-align: center;
            margin-top: 20px;
        }

        .apply-btn {
            background: linear-gradient(135deg, #ffb5b5, #b5d1a3);
            color: white;
            border: none;
            padding: 20px 50px;
            border-radius: 60px;
            font-size: 24px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin: 40px 0;
            width: 100%;
        }

        .apply-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 50px rgba(255, 181, 181, 0.4);
        }

        .uni-website {
            text-align: center;
            margin: 30px 0;
        }

        .uni-website a {
            color: #ff9e9e;
            font-size: 18px;
            text-decoration: none;
            border-bottom: 2px solid #ffe4e4;
            padding-bottom: 5px;
        }

        .uni-website a:hover {
            border-bottom-color: #ff9e9e;
        }
    </style>
