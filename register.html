<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Регистрация — K-Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#16231e;--paper:#f6f1e7;--red:#b42431;--blue:#0047a0;--gold:#dcbf6c;--quiet:#617069}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;overflow:hidden;color:var(--ink);background:radial-gradient(circle at 12% 12%,rgba(180,36,49,.16),transparent 23%),radial-gradient(circle at 90% 87%,rgba(0,71,160,.14),transparent 25%),var(--paper);font-family:"DM Sans","Noto Sans KR",sans-serif}.trigram{position:fixed;right:10%;bottom:10%;width:54px;height:38px;opacity:.5;background:repeating-linear-gradient(to bottom,var(--ink) 0 4px,transparent 4px 10px);transform:rotate(-42deg)}.trigram::after{content:"";position:absolute;inset:0 20px;background:var(--paper)}.auth{width:min(100% - 36px,460px);padding:38px;position:relative;border:1px solid var(--ink);background:#fffdf7;box-shadow:8px 8px 0 var(--gold)}.back{display:inline-block;margin-bottom:35px;color:var(--quiet);font-size:12px;font-weight:700;letter-spacing:.08em;text-decoration:none}.back:hover{color:var(--red)}.eyebrow{color:var(--red);font-size:11px;font-weight:700;letter-spacing:.12em}.auth h1{margin:12px 0 10px;font-family:Georgia,"Noto Sans KR",serif;font-size:43px;font-weight:500;letter-spacing:-.06em}.auth p{margin:0 0 27px;color:var(--quiet);line-height:1.55}.input{width:100%;margin-bottom:11px;padding:15px;border:1px solid rgba(22,35,30,.25);outline:0;background:#fffdf7;font:inherit}.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,71,160,.12)}.submit{width:100%;margin-top:4px;padding:15px;border:1px solid var(--ink);color:#fffdf7;background:var(--ink);font-weight:700;cursor:pointer}.switch{text-align:center;font-size:13px}.switch a{color:var(--red);font-weight:700}.seal{position:absolute;right:37px;top:39px;width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--ink);border-radius:50%;font-size:14px}@media(max-width:480px){.auth{padding:29px 23px}.auth h1{font-size:37px}}
  </style>
</head>
<body>
  <div class="trigram"></div>
  <main class="auth"><a class="back" href="index.html">← НАЗАД НА ГЛАВНУЮ</a><span class="seal">ㅋ</span><div class="eyebrow">K‑LAB / ПЕРВЫЙ ШАГ</div><h1>Начнём вместе.</h1><p>Создай аккаунт — и получи семь дней доступа к K‑Lab.</p><input class="input" id="regName" type="text" placeholder="Твоё имя"><input class="input" id="regEmail" type="email" placeholder="Email"><input class="input" id="regPassword" type="password" placeholder="Пароль (минимум 6 символов)"><button class="submit" onclick="handleRegister()">СОЗДАТЬ АККАУНТ →</button><p class="switch">Уже учишься с нами? <a href="login.html">Войти</a></p></main>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script><script src="firebase.js"></script><script src="script.js"></script>
</body>
</html>
